name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[sources,test,reports]'
      - name: Run acceptance checks
        run: python -m pytest -q
      - name: Build offline initialization review
        run: python scripts/initialization-report.py --output output/initialization-review
      - name: Replay visual mock LC challenges
        run: python scripts/mock-hplc-trials.py --output output/mock-hplc
