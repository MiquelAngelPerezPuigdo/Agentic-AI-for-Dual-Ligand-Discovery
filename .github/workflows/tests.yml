name: Software checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - name: Install dependencies
        run: |
          python -m pip install 'uv==0.13.1'
          uv sync --locked --python 3.12 --extra sources --extra test --extra reports
      - name: Run acceptance checks
        run: uv run --locked python -m pytest -q
      - name: Build offline initialization review
        run: uv run --locked python scripts/initialization-report.py --output output/initialization-review
      - name: Replay visual mock LC challenges
        run: uv run --locked python scripts/mock-hplc-trials.py --output output/mock-hplc
      - name: Build assumed LC separation scenarios and check numerical solver
        run: uv run --locked python scripts/simulate-lc-separation.py --draws 64 --output output/lc-separation
