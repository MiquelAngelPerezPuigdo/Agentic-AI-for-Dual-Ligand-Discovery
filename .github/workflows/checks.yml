name: Single-run checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install 'uv==0.13.1'
          uv sync --locked --extra test --extra docs
      - name: Test robot files, liquid budget and LC pipeline
        run: uv run python -m pytest -q
      - name: Check printable bench sheet
        run: uv run python scripts/build-bench-pdf.py --check
