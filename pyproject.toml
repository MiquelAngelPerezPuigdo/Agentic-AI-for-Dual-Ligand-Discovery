[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-hte"
version = "0.1.0"
description = "Local OT-2 dual-ligand screening and audited LC-to-LLM iteration"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "rdkit>=2024.3", "anthropic>=0.50,<1"]

[project.optional-dependencies]
sources = ["openpyxl>=3.1", "pypdf>=5"]
test = ["pytest>=8", "opentrons==8.8.2"]
analytics = ["mocca2==0.1.18"]
embeddings = ["torch>=2.3", "transformers>=4.43,<5"]
docs = ["reportlab>=4.4,<5", "mistune>=3.1,<4", "pypdf>=5,<7"]

[project.scripts]
hte = "hte.cli:main"

[tool.setuptools.packages.find]
include = ["hte*"]

[tool.setuptools.package-data]
"hte.vendor" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/hte"]
