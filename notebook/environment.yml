name: dual-ligand-notebook

variables:
  PYTHONNOUSERSITE: "1"

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - numpy==1.26.4
      - torch==2.6.0+cu124
      - transformers==4.51.2
      - jupyterlab>=4,<5
      - ipykernel>=6
      - nbformat>=5
      - nbclient>=0.10
      - pandas>=2,<3
      - matplotlib>=3.8
      - scipy>=1.11,<2
      - scikit-learn>=1.4,<2
      - sentencepiece>=0.2
      - -e .
